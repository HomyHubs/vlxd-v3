openapi: 3.1.0
info:
  title: vlxd-v3 API
  version: 0.1.0
  description: Contract for the vlxd-v3 construction-materials management API.
servers:
  - url: http://localhost:3000
    description: Local development
paths:
  /health:
    get:
      operationId: getHealth
      summary: Check the full application and database path
      responses:
        "200":
          description: Application and database are ready
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
        "503":
          description: Database is unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthUnavailable"
  /healthz:
    get:
      operationId: getLiveness
      summary: Check whether the API process is alive
      responses:
        "200":
          description: API process is alive
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LivenessStatus"
  /readyz:
    get:
      operationId: getReadiness
      summary: Check whether the API is ready to receive traffic
      responses:
        "200":
          description: API and database are ready
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
        "503":
          description: Database is unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthUnavailable"
  /auth/login:
    post:
      operationId: login
      summary: Authenticate user and issue an opaque session cookie
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: Login successful
          headers:
            Set-Cookie:
              schema:
                type: string
              description: Session cookie
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthSessionResponse"
        "400":
          description: Invalid request payload
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthErrorResponse"
        "401":
          description: Invalid email or password
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthErrorResponse"
  /auth/logout:
    post:
      operationId: logout
      summary: Invalidate the current session and clear cookie
      responses:
        "200":
          description: Logout successful
          headers:
            Set-Cookie:
              schema:
                type: string
              description: Cleared session cookie
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthLogoutResponse"
  /auth/me:
    get:
      operationId: getMe
      summary: Get the currently authenticated user and tenant profile
      responses:
        "200":
          description: Active session details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthSessionResponse"
        "401":
          description: Unauthorized or session expired
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthErrorResponse"
  /products:
    get:
      operationId: listProducts
      summary: List products for the authenticated tenant
      parameters:
        - $ref: "#/components/parameters/ExpectedTenantIdHeader"
        - $ref: "#/components/parameters/ExpectedSessionContextHeader"
        - in: query
          name: page
          schema: { type: integer, minimum: 1, default: 1 }
        - in: query
          name: pageSize
          schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
        - in: query
          name: search
          schema: { type: string, maxLength: 100 }
      responses:
        "200":
          description: Paginated product list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProductListResponse"
        "401":
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProductErrorResponse"
        "403":
          description: Permission denied (requires products.view)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProductErrorResponse"
        "409":
          $ref: "#/components/responses/AuthContextChangedResponse"
    post:
      operationId: createProduct
      summary: Create a product for the authenticated tenant
      parameters:
        - $ref: "#/components/parameters/ExpectedTenantIdHeader"
        - $ref: "#/components/parameters/ExpectedSessionContextHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateProductRequest"
      responses:
        "201":
          description: Product created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Product"
        "400":
          description: Invalid input or unknown unit
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProductErrorResponse"
        "401":
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProductErrorResponse"
        "403":
          description: Permission denied (requires products.manage)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProductErrorResponse"
        "409":
          description: SKU already exists for the tenant, or authentication context changed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProductErrorResponse"
        "422":
          description: Free plan product limit reached
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProductErrorResponse"
  /warehouses:
    get:
      operationId: listWarehouses
      summary: List warehouses for the authenticated tenant
      parameters:
        - $ref: "#/components/parameters/ExpectedTenantIdHeader"
        - $ref: "#/components/parameters/ExpectedSessionContextHeader"
      responses:
        "200":
          description: Warehouse list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WarehouseListResponse"
        "401":
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WarehouseErrorResponse"
        "403":
          description: Permission denied (requires inventory.view)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WarehouseErrorResponse"
        "409":
          $ref: "#/components/responses/AuthContextChangedResponse"
    post:
      operationId: createWarehouse
      summary: Create a warehouse for the authenticated tenant
      parameters:
        - $ref: "#/components/parameters/ExpectedTenantIdHeader"
        - $ref: "#/components/parameters/ExpectedSessionContextHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateWarehouseRequest"
      responses:
        "201":
          description: Warehouse created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Warehouse"
        "400":
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WarehouseErrorResponse"
        "401":
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WarehouseErrorResponse"
        "403":
          description: Permission denied (requires inventory.manage)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WarehouseErrorResponse"
        "409":
          description: Warehouse code already exists for the tenant, or authentication context changed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WarehouseErrorResponse"
        "422":
          description: Free plan warehouse limit reached
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WarehouseErrorResponse"
  /stock-receipts:
    get:
      operationId: listStockReceipts
      summary: List stock receipts for the authenticated tenant
      parameters:
        - $ref: "#/components/parameters/ExpectedTenantIdHeader"
        - $ref: "#/components/parameters/ExpectedSessionContextHeader"
        - in: query
          name: page
          schema: { type: integer, minimum: 1, default: 1 }
        - in: query
          name: pageSize
          schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
        - in: query
          name: warehouseId
          schema: { type: string }
      responses:
        "200":
          description: Paginated list of stock receipts
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StockReceiptListResponse"
        "401":
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StockReceiptErrorResponse"
        "403":
          description: Permission denied (requires inventory.view)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StockReceiptErrorResponse"
        "409":
          $ref: "#/components/responses/AuthContextChangedResponse"
    post:
      operationId: createStockReceipt
      summary: Create an inbound stock receipt and update stock levels
      parameters:
        - $ref: "#/components/parameters/ExpectedTenantIdHeader"
        - $ref: "#/components/parameters/ExpectedSessionContextHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateStockReceiptRequest"
      responses:
        "201":
          description: Stock receipt created successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StockReceiptDetailResponse"
        "400":
          description: Invalid request payload or lines
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StockReceiptErrorResponse"
        "401":
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StockReceiptErrorResponse"
        "403":
          description: Permission denied (requires inventory.manage)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StockReceiptErrorResponse"
        "404":
          description: Warehouse or product not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StockReceiptErrorResponse"
        "409":
          description: Overflow ceiling or context mismatch
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StockReceiptErrorResponse"
  /stock-receipts/{id}:
    get:
      operationId: getStockReceipt
      summary: Get details of a single stock receipt
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
        - $ref: "#/components/parameters/ExpectedTenantIdHeader"
        - $ref: "#/components/parameters/ExpectedSessionContextHeader"
      responses:
        "200":
          description: Stock receipt details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StockReceiptDetailResponse"
        "401":
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StockReceiptErrorResponse"
        "403":
          description: Permission denied (requires inventory.view)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StockReceiptErrorResponse"
        "404":
          description: Stock receipt not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StockReceiptErrorResponse"
        "409":
          $ref: "#/components/responses/AuthContextChangedResponse"
  /customers:
    get:
      operationId: listCustomers
      summary: List customers for the authenticated tenant
      parameters:
        - $ref: "#/components/parameters/ExpectedTenantIdHeader"
        - $ref: "#/components/parameters/ExpectedSessionContextHeader"
      responses:
        "200":
          description: List of customers
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CustomerListResponse"
        "401":
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CustomerErrorResponse"
        "403":
          description: Permission denied (requires customers.manage)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CustomerErrorResponse"
        "409":
          $ref: "#/components/responses/AuthContextChangedResponse"
    post:
      operationId: createCustomer
      summary: Create a new customer
      parameters:
        - $ref: "#/components/parameters/ExpectedTenantIdHeader"
        - $ref: "#/components/parameters/ExpectedSessionContextHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateCustomerRequest"
      responses:
        "201":
          description: Customer created successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Customer"
        "400":
          description: Invalid customer data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CustomerErrorResponse"
        "401":
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CustomerErrorResponse"
        "403":
          description: Permission denied (requires customers.manage)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CustomerErrorResponse"
        "409":
          description: Customer code already exists, or authentication context changed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CustomerErrorResponse"
  /sales-orders:
    get:
      operationId: listSalesOrders
      summary: List sales orders for the authenticated tenant
      parameters:
        - $ref: "#/components/parameters/ExpectedTenantIdHeader"
        - $ref: "#/components/parameters/ExpectedSessionContextHeader"
        - in: query
          name: page
          schema: { type: integer, minimum: 1, default: 1 }
        - in: query
          name: pageSize
          schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
        - in: query
          name: customerId
          schema: { type: string }
        - in: query
          name: warehouseId
          schema: { type: string }
      responses:
        "200":
          description: Paginated list of sales orders
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SalesOrderListResponse"
        "401":
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SalesOrderErrorResponse"
        "403":
          description: Permission denied (requires sales.view)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SalesOrderErrorResponse"
        "409":
          $ref: "#/components/responses/AuthContextChangedResponse"
    post:
      operationId: createSalesOrder
      summary: Create a sales order and deduct inventory
      parameters:
        - $ref: "#/components/parameters/ExpectedTenantIdHeader"
        - $ref: "#/components/parameters/ExpectedSessionContextHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateSalesOrderRequest"
      responses:
        "201":
          description: Sales order created successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SalesOrderDetailResponse"
        "400":
          description: Invalid request payload or lines
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SalesOrderErrorResponse"
        "401":
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SalesOrderErrorResponse"
        "403":
          description: Permission denied (requires sales.create)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SalesOrderErrorResponse"
        "404":
          description: Customer, warehouse, or product not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SalesOrderErrorResponse"
        "409":
          description: Insufficient stock, order limit or authentication context changed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SalesOrderErrorResponse"
        "422":
          description: Insufficient stock for one or more products
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SalesOrderErrorResponse"
  /sales-orders/{id}:
    get:
      operationId: getSalesOrder
      summary: Get details of a single sales order
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
        - $ref: "#/components/parameters/ExpectedTenantIdHeader"
        - $ref: "#/components/parameters/ExpectedSessionContextHeader"
      responses:
        "200":
          description: Sales order details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SalesOrderDetailResponse"
        "401":
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SalesOrderErrorResponse"
        "403":
          description: Permission denied (requires sales.view)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SalesOrderErrorResponse"
        "404":
          description: Sales order not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SalesOrderErrorResponse"
        "409":
          $ref: "#/components/responses/AuthContextChangedResponse"
  /sales-orders/{id}/payments:
    post:
      operationId: recordSalesOrderPayment
      summary: Record a payment against a sales order
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
        - $ref: "#/components/parameters/ExpectedTenantIdHeader"
        - $ref: "#/components/parameters/ExpectedSessionContextHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RecordPaymentRequest"
      responses:
        "201":
          description: Payment recorded successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RecordPaymentResponse"
        "400":
          description: Invalid request payload
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaymentErrorResponse"
        "401":
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaymentErrorResponse"
        "403":
          description: Permission denied (requires sales.create)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaymentErrorResponse"
        "404":
          description: Sales order not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaymentErrorResponse"
        "409":
          $ref: "#/components/responses/AuthContextChangedResponse"
        "422":
          description: Payment exceeds remaining amount or order already paid
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaymentErrorResponse"
    get:
      operationId: listSalesOrderPayments
      summary: List payments and payment summary for a sales order
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
        - $ref: "#/components/parameters/ExpectedTenantIdHeader"
        - $ref: "#/components/parameters/ExpectedSessionContextHeader"
      responses:
        "200":
          description: Payments and summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrderPaymentsListResponse"
        "401":
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaymentErrorResponse"
        "403":
          description: Permission denied (requires sales.view)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaymentErrorResponse"
        "404":
          description: Sales order not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaymentErrorResponse"
        "409":
          $ref: "#/components/responses/AuthContextChangedResponse"
  /titles:
    get:
      operationId: listTitles
      summary: List available titles for user assignment
      parameters:
        - $ref: "#/components/parameters/ExpectedTenantIdHeader"
        - $ref: "#/components/parameters/ExpectedSessionContextHeader"
      responses:
        "200":
          description: List of available titles
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TitleListResponse"
        "401":
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserErrorResponse"
        "403":
          description: Permission denied (requires users.manage)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserErrorResponse"
        "409":
          $ref: "#/components/responses/AuthContextChangedResponse"
  /users:
    get:
      operationId: listUsers
      summary: List tenant users with their assigned titles
      parameters:
        - $ref: "#/components/parameters/ExpectedTenantIdHeader"
        - $ref: "#/components/parameters/ExpectedSessionContextHeader"
      responses:
        "200":
          description: List of tenant users
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserListResponse"
        "401":
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserErrorResponse"
        "403":
          description: Permission denied (requires users.manage)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserErrorResponse"
        "409":
          $ref: "#/components/responses/AuthContextChangedResponse"
    post:
      operationId: createUser
      summary: Create a new user and assign a title
      parameters:
        - $ref: "#/components/parameters/ExpectedTenantIdHeader"
        - $ref: "#/components/parameters/ExpectedSessionContextHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateUserRequest"
      responses:
        "201":
          description: User created successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserItem"
        "400":
          description: Invalid request payload
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserErrorResponse"
        "401":
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserErrorResponse"
        "403":
          description: Permission denied (requires users.manage)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserErrorResponse"
        "409":
          description: Email already exists for this tenant, or authentication context changed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserErrorResponse"
components:
  parameters:
    ExpectedTenantIdHeader:
      name: x-expected-tenant-id
      in: header
      required: false
      description: Precondition tenant ID expected by the client. Mandatory at runtime for all authenticated tenant operations; enforced fail-closed (409 AUTH_CONTEXT_CHANGED) by server capability middleware.
      schema:
        type: string
    ExpectedSessionContextHeader:
      name: x-session-context
      in: header
      required: false
      description: Precondition header matching tenantId:userId. When supplied, verifies caller session identity.
      schema:
        type: string
  responses:
    AuthContextChangedResponse:
      description: Tenant or session identity context mismatch / changed
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/AuthContextChangedError"
  schemas:
    AuthContextChangedError:
      type: object
      additionalProperties: false
      required: [code, message]
      properties:
        code:
          type: string
          enum: [AUTH_CONTEXT_CHANGED]
        message: { type: string }
    LivenessStatus:
      type: object
      additionalProperties: false
      required: [status]
      properties:
        status:
          type: string
          const: ok
    HealthStatus:
      type: object
      additionalProperties: false
      required: [status, db]
      properties:
        status:
          type: string
          const: ok
        db:
          type: string
          const: ok
    HealthUnavailable:
      type: object
      additionalProperties: false
      required: [status, db, code]
      properties:
        status:
          type: string
          const: unavailable
        db:
          type: string
          const: unavailable
        code:
          type: string
          const: DATABASE_UNAVAILABLE
    LoginRequest:
      type: object
      additionalProperties: false
      required: [email, password]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 1
    AuthUser:
      type: object
      additionalProperties: false
      required: [id, email, fullName, tenantId, status, titles, capabilities]
      properties:
        id:
          type: string
        email:
          type: string
          format: email
        fullName:
          type: string
        tenantId:
          type: string
        status:
          type: string
          enum: [active, inactive]
        titles:
          type: array
          items:
            type: string
        capabilities:
          type: array
          items:
            type: string
    AuthTenant:
      type: object
      additionalProperties: false
      required: [id, name, code, plan]
      properties:
        id:
          type: string
        name:
          type: string
        code:
          type: string
        plan:
          type: string
    AuthSessionResponse:
      type: object
      additionalProperties: false
      required: [user, tenant]
      properties:
        user:
          $ref: "#/components/schemas/AuthUser"
        tenant:
          $ref: "#/components/schemas/AuthTenant"
    AuthLogoutResponse:
      type: object
      additionalProperties: false
      required: [success]
      properties:
        success:
          type: boolean
    AuthErrorResponse:
      type: object
      additionalProperties: false
      required: [code, message]
      properties:
        code:
          type: string
        message:
          type: string
    UnitCode:
      type: string
      enum: [vien, bao, tan, kg, m3, cay, tam, thung]
    Product:
      type: object
      additionalProperties: false
      required: [id, sku, name, unitCode, unitName, createdAt, stockLevels]
      properties:
        id: { type: string }
        sku: { type: string }
        name: { type: string }
        unitCode: { $ref: "#/components/schemas/UnitCode" }
        unitName: { type: string }
