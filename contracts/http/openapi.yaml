openapi: 3.1.0
info:
  title: vlxd-v3 API
  version: 0.1.0
  description: Contract for the vlxd-v3 construction-materials management API.
servers:
  - url: http://localhost:3000
    description: Local development
paths:
  /health:
    get:
      operationId: getHealth
      summary: Check the full application and database path
      responses:
        "200":
          description: Application and database are ready
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
        "503":
          description: Database is unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthUnavailable"
  /healthz:
    get:
      operationId: getLiveness
      summary: Check whether the API process is alive
      responses:
        "200":
          description: API process is alive
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LivenessStatus"
  /readyz:
    get:
      operationId: getReadiness
      summary: Check whether the API is ready to receive traffic
      responses:
        "200":
          description: API and database are ready
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
        "503":
          description: Database is unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthUnavailable"
  /auth/login:
    post:
      operationId: login
      summary: Authenticate user and issue an opaque session cookie
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: Login successful
          headers:
            Set-Cookie:
              schema:
                type: string
              description: Session cookie
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthSessionResponse"
        "400":
          description: Invalid request payload
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthErrorResponse"
        "401":
          description: Invalid email or password
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthErrorResponse"
  /auth/logout:
    post:
      operationId: logout
      summary: Invalidate the current session and clear cookie
      responses:
        "200":
          description: Logout successful
          headers:
            Set-Cookie:
              schema:
                type: string
              description: Cleared session cookie
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthLogoutResponse"
  /auth/me:
    get:
      operationId: getMe
      summary: Get the currently authenticated user and tenant profile
      responses:
        "200":
          description: Active session details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthSessionResponse"
        "401":
          description: Unauthorized or session expired
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthErrorResponse"
  /products:
    get:
      operationId: listProducts
      summary: List products for the authenticated tenant
      parameters:
        - in: query
          name: page
          schema: { type: integer, minimum: 1, default: 1 }
        - in: query
          name: pageSize
          schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
        - in: query
          name: search
          schema: { type: string, maxLength: 100 }
      responses:
        "200":
          description: Paginated product list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProductListResponse"
        "401":
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProductErrorResponse"
    post:
      operationId: createProduct
      summary: Create a product for the authenticated tenant
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateProductRequest"
      responses:
        "201":
          description: Product created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Product"
        "400":
          description: Invalid input or unknown unit
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProductErrorResponse"
        "401":
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProductErrorResponse"
        "409":
          description: SKU already exists for the tenant
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProductErrorResponse"
        "422":
          description: Free plan product limit reached
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProductErrorResponse"
  /warehouses:
    get:
      operationId: listWarehouses
      summary: List warehouses for the authenticated tenant
      responses:
        "200":
          description: Warehouse list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WarehouseListResponse"
        "401":
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WarehouseErrorResponse"
    post:
      operationId: createWarehouse
      summary: Create a warehouse for the authenticated tenant
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateWarehouseRequest"
      responses:
        "201":
          description: Warehouse created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Warehouse"
        "400":
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WarehouseErrorResponse"
        "401":
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WarehouseErrorResponse"
        "409":
          description: Warehouse code already exists for the tenant
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WarehouseErrorResponse"
        "422":
          description: Free plan warehouse limit reached
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WarehouseErrorResponse"
  /stock-receipts:
    get:
      operationId: listStockReceipts
      summary: List stock receipts for the authenticated tenant
      parameters:
        - in: query
          name: page
          schema: { type: integer, minimum: 1, default: 1 }
        - in: query
          name: pageSize
          schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
        - in: query
          name: warehouseId
          schema: { type: string }
      responses:
        "200":
          description: Paginated list of stock receipts
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StockReceiptListResponse"
        "401":
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StockReceiptErrorResponse"
    post:
      operationId: createStockReceipt
      summary: Create an inbound stock receipt and update stock levels
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateStockReceiptRequest"
      responses:
        "201":
          description: Stock receipt created successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StockReceiptDetailResponse"
        "400":
          description: Invalid request payload or lines
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StockReceiptErrorResponse"
        "401":
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StockReceiptErrorResponse"
        "404":
          description: Warehouse or product not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StockReceiptErrorResponse"
  /stock-receipts/{id}:
    get:
      operationId: getStockReceipt
      summary: Get details of a single stock receipt
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Stock receipt details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StockReceiptDetailResponse"
        "401":
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StockReceiptErrorResponse"
        "404":
          description: Stock receipt not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StockReceiptErrorResponse"
components:
  schemas:
    LivenessStatus:
      type: object
      additionalProperties: false
      required: [status]
      properties:
        status:
          type: string
          const: ok
    HealthStatus:
      type: object
      additionalProperties: false
      required: [status, db]
      properties:
        status:
          type: string
          const: ok
        db:
          type: string
          const: ok
    HealthUnavailable:
      type: object
      additionalProperties: false
      required: [status, db, code]
      properties:
        status:
          type: string
          const: unavailable
        db:
          type: string
          const: unavailable
        code:
          type: string
          const: DATABASE_UNAVAILABLE
    LoginRequest:
      type: object
      additionalProperties: false
      required: [email, password]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 1
    AuthUser:
      type: object
      additionalProperties: false
      required: [id, email, fullName, tenantId, status]
      properties:
        id:
          type: string
        email:
          type: string
          format: email
        fullName:
          type: string
        tenantId:
          type: string
        status:
          type: string
          enum: [active, inactive]
    AuthTenant:
      type: object
      additionalProperties: false
      required: [id, name, code, plan]
      properties:
        id:
          type: string
        name:
          type: string
        code:
          type: string
        plan:
          type: string
    AuthSessionResponse:
      type: object
      additionalProperties: false
      required: [user, tenant]
      properties:
        user:
          $ref: "#/components/schemas/AuthUser"
        tenant:
          $ref: "#/components/schemas/AuthTenant"
    AuthLogoutResponse:
      type: object
      additionalProperties: false
      required: [success]
      properties:
        success:
          type: boolean
    AuthErrorResponse:
      type: object
      additionalProperties: false
      required: [code, message]
      properties:
        code:
          type: string
        message:
          type: string
    UnitCode:
      type: string
      enum: [vien, bao, tan, kg, m3, cay, tam, thung]
    Product:
      type: object
      additionalProperties: false
      required: [id, sku, name, unitCode, unitName, createdAt, stockLevels]
      properties:
        id: { type: string }
        sku: { type: string }
        name: { type: string }
        unitCode: { $ref: "#/components/schemas/UnitCode" }
        unitName: { type: string }
        createdAt: { type: string, format: date-time }
        stockLevels:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [warehouseId, warehouseCode, quantity]
            properties:
              warehouseId: { type: string }
              warehouseCode: { type: string }
              quantity: { type: integer, minimum: 0 }
    ProductListResponse:
      type: object
      additionalProperties: false
      required: [items, page, pageSize, total]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/Product" }
        page: { type: integer }
        pageSize: { type: integer }
        total: { type: integer }
    CreateProductRequest:
      type: object
      additionalProperties: false
      required: [sku, name, unitCode]
      properties:
        sku: { type: string, minLength: 1, maxLength: 50 }
        name: { type: string, minLength: 1, maxLength: 200 }
        unitCode: { $ref: "#/components/schemas/UnitCode" }
    ProductErrorResponse:
      type: object
      additionalProperties: false
      required: [code, message]
      properties:
        code:
          type: string
          enum: [UNAUTHORIZED, PRODUCT_LIMIT_REACHED, PRODUCT_SKU_EXISTS, UNIT_NOT_FOUND]
        message: { type: string }
    Warehouse:
      type: object
      additionalProperties: false
      required: [id, code, name, createdAt]
      properties:
        id: { type: string }
        code: { type: string }
        name: { type: string }
        createdAt: { type: string, format: date-time }
    WarehouseListResponse:
      type: object
      additionalProperties: false
      required: [items, total]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/Warehouse" }
        total: { type: integer }
    CreateWarehouseRequest:
      type: object
      additionalProperties: false
      required: [code, name]
      properties:
        code: { type: string, minLength: 1, maxLength: 30 }
        name: { type: string, minLength: 1, maxLength: 120 }
    WarehouseErrorResponse:
      type: object
      additionalProperties: false
      required: [code, message]
      properties:
        code:
          type: string
          enum: [UNAUTHORIZED, WAREHOUSE_LIMIT_REACHED, WAREHOUSE_CODE_EXISTS]
        message: { type: string }
    CreateStockReceiptLineInput:
      type: object
      additionalProperties: false
      required: [productId, quantity]
      properties:
        productId: { type: string }
        quantity: { type: integer, minimum: 1 }
    CreateStockReceiptRequest:
      type: object
      additionalProperties: false
      required: [warehouseId, lines]
      properties:
        warehouseId: { type: string }
        note: { type: string, maxLength: 500 }
        lines:
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/CreateStockReceiptLineInput"
    StockReceiptLine:
      type: object
      additionalProperties: false
      required: [id, productId, productSku, productName, unitName, quantity]
      properties:
        id: { type: string }
        productId: { type: string }
        productSku: { type: string }
        productName: { type: string }
        unitName: { type: string }
        quantity: { type: integer, minimum: 1 }
    StockReceiptListItem:
      type: object
      additionalProperties: false
      required:
        [
          id,
          receiptNumber,
          warehouseId,
          warehouseCode,
          warehouseName,
          status,
          createdByName,
          createdAt,
          itemCount,
          totalQuantity,
        ]
      properties:
        id: { type: string }
        receiptNumber: { type: string }
        warehouseId: { type: string }
        warehouseCode: { type: string }
        warehouseName: { type: string }
        status: { type: string }
        note:
          type: [string, "null"]
        createdByName: { type: string }
        createdAt: { type: string, format: date-time }
        itemCount: { type: integer }
        totalQuantity: { type: integer }
    StockReceiptListResponse:
      type: object
      additionalProperties: false
      required: [items, page, pageSize, total]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/StockReceiptListItem"
        page: { type: integer }
        pageSize: { type: integer }
        total: { type: integer }
    StockReceiptDetailResponse:
      type: object
      additionalProperties: false
      required:
        [
          id,
          receiptNumber,
          warehouseId,
          warehouseCode,
          warehouseName,
          status,
          createdByName,
          createdAt,
          lines,
          totalQuantity,
        ]
      properties:
        id: { type: string }
        receiptNumber: { type: string }
        warehouseId: { type: string }
        warehouseCode: { type: string }
        warehouseName: { type: string }
        status: { type: string }
        note:
          type: [string, "null"]
        createdByName: { type: string }
        createdAt: { type: string, format: date-time }
        totalQuantity: { type: integer }
        lines:
          type: array
          items:
            $ref: "#/components/schemas/StockReceiptLine"
    StockReceiptErrorResponse:
      type: object
      additionalProperties: false
      required: [code, message]
      properties:
        code:
          type: string
          enum: [UNAUTHORIZED, WAREHOUSE_NOT_FOUND, PRODUCT_NOT_FOUND, INVALID_RECEIPT_LINES]
        message: { type: string }
