openapi: 3.1.0
info:
  title: vlxd-v3 API
  version: 0.1.0
  description: Contract for the vlxd-v3 construction-materials management API.
servers:
  - url: http://localhost:3000
    description: Local development
paths:
  /health:
    get:
      operationId: getHealth
      summary: Check the full application and database path
      responses:
        "200":
          description: Application and database are ready
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
        "503":
          description: Database is unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthUnavailable"
  /healthz:
    get:
      operationId: getLiveness
      summary: Check whether the API process is alive
      responses:
        "200":
          description: API process is alive
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LivenessStatus"
  /readyz:
    get:
      operationId: getReadiness
      summary: Check whether the API is ready to receive traffic
      responses:
        "200":
          description: API and database are ready
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
        "503":
          description: Database is unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthUnavailable"
  /auth/login:
    post:
      operationId: login
      summary: Authenticate user and issue an opaque session cookie
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: Login successful
          headers:
            Set-Cookie:
              schema:
                type: string
              description: Session cookie
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthSessionResponse"
        "400":
          description: Invalid request payload
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthErrorResponse"
        "401":
          description: Invalid email or password
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthErrorResponse"
  /auth/logout:
    post:
      operationId: logout
      summary: Invalidate the current session and clear cookie
      responses:
        "200":
          description: Logout successful
          headers:
            Set-Cookie:
              schema:
                type: string
              description: Cleared session cookie
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthLogoutResponse"
  /auth/me:
    get:
      operationId: getMe
      summary: Get the currently authenticated user and tenant profile
      responses:
        "200":
          description: Active session details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthSessionResponse"
        "401":
          description: Unauthorized or session expired
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthErrorResponse"
  /products:
    get:
      operationId: listProducts
      summary: List products for the authenticated tenant
      parameters:
        - in: query
          name: page
          schema: { type: integer, minimum: 1, default: 1 }
        - in: query
          name: pageSize
          schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
        - in: query
          name: search
          schema: { type: string, maxLength: 100 }
      responses:
        "200":
          description: Paginated product list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProductListResponse"
        "401":
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProductErrorResponse"
    post:
      operationId: createProduct
      summary: Create a product for the authenticated tenant
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateProductRequest"
      responses:
        "201":
          description: Product created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Product"
        "400":
          description: Invalid input or unknown unit
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProductErrorResponse"
        "401":
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProductErrorResponse"
        "409":
          description: SKU already exists for the tenant
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProductErrorResponse"
        "422":
          description: Free plan product limit reached
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProductErrorResponse"
components:
  schemas:
    LivenessStatus:
      type: object
      additionalProperties: false
      required: [status]
      properties:
        status:
          type: string
          const: ok
    HealthStatus:
      type: object
      additionalProperties: false
      required: [status, db]
      properties:
        status:
          type: string
          const: ok
        db:
          type: string
          const: ok
    HealthUnavailable:
      type: object
      additionalProperties: false
      required: [status, db, code]
      properties:
        status:
          type: string
          const: unavailable
        db:
          type: string
          const: unavailable
        code:
          type: string
          const: DATABASE_UNAVAILABLE
    LoginRequest:
      type: object
      additionalProperties: false
      required: [email, password]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 1
    AuthUser:
      type: object
      additionalProperties: false
      required: [id, email, fullName, tenantId, status]
      properties:
        id:
          type: string
        email:
          type: string
          format: email
        fullName:
          type: string
        tenantId:
          type: string
        status:
          type: string
          enum: [active, inactive]
    AuthTenant:
      type: object
      additionalProperties: false
      required: [id, name, code, plan]
      properties:
        id:
          type: string
        name:
          type: string
        code:
          type: string
        plan:
          type: string
    AuthSessionResponse:
      type: object
      additionalProperties: false
      required: [user, tenant]
      properties:
        user:
          $ref: "#/components/schemas/AuthUser"
        tenant:
          $ref: "#/components/schemas/AuthTenant"
    AuthLogoutResponse:
      type: object
      additionalProperties: false
      required: [success]
      properties:
        success:
          type: boolean
    AuthErrorResponse:
      type: object
      additionalProperties: false
      required: [code, message]
      properties:
        code:
          type: string
        message:
          type: string
    UnitCode:
      type: string
      enum: [vien, bao, tan, kg, m3, cay, tam, thung]
    Product:
      type: object
      additionalProperties: false
      required: [id, sku, name, unitCode, unitName, createdAt]
      properties:
        id: { type: string }
        sku: { type: string }
        name: { type: string }
        unitCode: { $ref: "#/components/schemas/UnitCode" }
        unitName: { type: string }
        createdAt: { type: string, format: date-time }
    ProductListResponse:
      type: object
      additionalProperties: false
      required: [items, page, pageSize, total]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/Product" }
        page: { type: integer }
        pageSize: { type: integer }
        total: { type: integer }
    CreateProductRequest:
      type: object
      additionalProperties: false
      required: [sku, name, unitCode]
      properties:
        sku: { type: string, minLength: 1, maxLength: 50 }
        name: { type: string, minLength: 1, maxLength: 200 }
        unitCode: { $ref: "#/components/schemas/UnitCode" }
    ProductErrorResponse:
      type: object
      additionalProperties: false
      required: [code, message]
      properties:
        code:
          type: string
          enum: [UNAUTHORIZED, PRODUCT_LIMIT_REACHED, PRODUCT_SKU_EXISTS, UNIT_NOT_FOUND]
        message: { type: string }
